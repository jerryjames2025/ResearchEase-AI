name: ResearchEase Docker CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - version-14-cicd

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Display Docker versions
        run: |
          docker --version
          docker compose version

      - name: Create Docker CI environment
        run: |
          cp .env.docker.example .env.docker

      - name: Validate base Compose configuration
        run: |
          docker compose \
            --env-file .env.docker \
            -f compose.yaml \
            config \
            --quiet

      - name: Validate CPU CI Compose configuration
        run: |
          docker compose \
            --env-file .env.docker \
            -f compose.yaml \
            -f compose.ci.yaml \
            config \
            --quiet

      - name: Render final Compose configuration
        run: |
          docker compose \
            --env-file .env.docker \
            -f compose.yaml \
            -f compose.ci.yaml \
            config \
            > compose.rendered.yaml

      - name: Verify CPU API Dockerfile override
        run: |
          grep -q "dockerfile: Dockerfile.api.ci" \
            compose.rendered.yaml

          echo "CPU API Dockerfile override verified."

      - name: Display configured services
        run: |
          docker compose \
            --env-file .env.docker \
            -f compose.yaml \
            -f compose.ci.yaml \
            config \
            --services

      - name: Upload rendered Compose configuration
        uses: actions/upload-artifact@v4
        with:
          name: rendered-compose-configuration
          path: compose.rendered.yaml
          retention-days: 7

  docker-build:
    name: Build ${{ matrix.name }}
    needs:
      - compose-validation

    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: FastAPI CPU Image
            dockerfile: Dockerfile.api.ci
            image: researchease-ai-api
            cache_scope: researchease-api-cpu

          - name: Streamlit Image
            dockerfile: Dockerfile.frontend
            image: researchease-ai-frontend
            cache_scope: researchease-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Display Buildx information
        run: |
          docker buildx version
          docker buildx ls

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64

          push: false
          load: false

          tags: ${{ matrix.image }}:ci

          cache-from: |
            type=gha,scope=${{ matrix.cache_scope }}

          cache-to: |
            type=gha,mode=min,scope=${{ matrix.cache_scope }}

          provenance: false
          sbom: false