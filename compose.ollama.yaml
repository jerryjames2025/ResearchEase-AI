services:
  ollama:
    image: ollama/ollama:latest
    container_name: researchease-ollama
    restart: unless-stopped

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s

    networks:
      - researchease_network

  api:
    environment:
      RESEARCHEASE_OLLAMA_BASE_URL: http://ollama:11434

    depends_on:
      ollama:
        condition: service_healthy


volumes:
  ollama_data:
    name: researchease-ollama-data