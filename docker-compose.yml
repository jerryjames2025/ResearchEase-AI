name: researchease-v8

services:
  postgres:
    image: postgres:17-alpine
    container_name: researchease-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researchease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-researchease_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-researchease}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-researchease} -d ${POSTGRES_DB:-researchease}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  mongodb:
    image: mongo:8.0
    container_name: researchease-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-researchease_mongo_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-researchease}

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 8s
      retries: 10


  redis:
    image: redis:8-alpine
    container_name: researchease-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  postgres_data:
  mongodb_data:
  redis_data: